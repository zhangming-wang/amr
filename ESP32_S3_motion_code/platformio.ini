; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
upload_speed = 460800

; Flash 配置（16MB QIO模式，80MHz）
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.arduino.partitions = default_16MB.csv  ; 16MB专用分区表

; PSRAM 配置（8MB 八进制OPI模式）
board_build.psram_enable = true
board_build.psram_type = octal
board_build.psram_size = 8MB
board_build.arduino.memory_type = qio_opi  ; 明确指定Flash+PSRAM模式

; 编译宏（匹配硬件特性）
build_flags = 
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_USE=1
  -DCONFIG_SPIRAM_TYPE_OCTAL=1  ; 强调八进制PSRAM类型
  -DCONFIG_SPIRAM_MODE_OCT=1
  -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1  ; 针对S3的PSRAM支持
  -mfix-esp32-psram-cache-issue  ; 解决PSRAM缓存冲突问题

