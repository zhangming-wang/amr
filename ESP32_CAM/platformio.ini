; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32cam]
board = esp32cam
platform = espressif32
framework = arduino
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_microros_transport = wifi
board_microros_distro = humble
lib_ldf_mode = deep

lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio.git
    plerup/EspSoftwareSerial@^8.0.1
    espressif/esp32-camera

build_flags =
;   -DCONFIG_SPIRAM_SUPPORT=1
  -DCONFIG_SPIRAM_USE_MALLOC=1
  -DCONFIG_MICRO_ROS_UTILITIES_MEMORY_PSRAM=1
; build_flags =
;     ; PBUF池大小：40个（每个2048字节，总约80KB，可容纳3个6KB图像的pbuf链）
;     -DCONFIG_PBUF_POOL_SIZE=40
;     ; 单个PBUF大小：2048字节（6KB图像需3个pbuf组成链，效率较高）
;     -DCONFIG_PBUF_POOL_BUFSIZE=2048
;     ; UDP发送缓冲区：12288字节（6KB的2倍，确保能完整容纳图像数据）
;     -DCONFIG_UDP_TX_BUF_SIZE=12288
;     ; UDP接收缓冲区：4096字节（接收需求低，保持适中）
;     -DCONFIG_UDP_RX_BUF_SIZE=4096
;     ; LwIP全局内存池：65536字节（64KB，提升大内存分配成功率）
;     -DCONFIG_LWIP_MEM_POOL_SIZE=65536
;     ; 关闭断言（调试阶段）
;     -DCONFIG_LWIP_ASSERT=0
;     ; 增加TCP窗口大小（若同时用TCP可加，纯UDP可选）
;     -DCONFIG_TCP_WND=8192
