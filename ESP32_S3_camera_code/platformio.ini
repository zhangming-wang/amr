; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
; 推荐固定平台版本，避免自动更新导致兼容性问题
platform = espressif32
board = esp32-s3-devkitc-1   ; 兼容多数esp32-s3-wroom-1模组 
framework = arduino

; 串口配置
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_rts = 0
monitor_dtr = 0
; micro-ROS配置
board_microros_transport = wifi
board_microros_distro = humble  ; 明确指定ROS 2版本

; Flash 配置（16MB QIO模式，80MHz）
board_upload.flash_size = 8MB
; board_upload.maximum_size = 8*1024*1024
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.arduino.partitions = default_8MB.csv  ; 16MB专用分区表

; PSRAM 配置（8MB 八进制OPI模式）
board_build.psram_enable = true
board_build.psram_type = opi
board_build.psram_size = 8MB
board_build.arduino.memory_type = qio_opi  ; 明确指定Flash+PSRAM模式

; 编译宏（匹配硬件特性）
build_flags = 
  -DBOARD_HAS_PSRAM=1
  -DCONFIG_SPIRAM_USE=1
  -DCONFIG_SPIRAM_TYPE_OCTAL=1  ; 强调八进制PSRAM类型
  -DCONFIG_SPIRAM_MODE_OCT=1
  -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1  ; 针对S3的PSRAM支持
  -mfix-esp32-psram-cache-issue  ; 解决PSRAM缓存冲突问题


lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio.git
    espressif/esp32-camera
