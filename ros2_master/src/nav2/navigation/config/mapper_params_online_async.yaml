slam_toolbox:
  ros__parameters:

    # 插件保持 Ceres，这是目前最稳的
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_loss_function: None

    # ROS 基础参数
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping 

    # 针对 X2 的采样特性优化
    transform_publish_period: 0.05 
    map_update_interval: 2.0
    resolution: 0.05
    # X2 远距离精度差，建议截断
    min_laser_range: 0.15 
    max_laser_range: 8.0  # 虽然标称更高，但 8 米以上的数据在 SLAM 中干扰很大
    
    # 核心：适配 X2 的 6Hz 和点数跳变
    minimum_time_interval: 0.1     # 确保不漏掉 X2 的每一帧数据
    transform_timeout: 0.4         # 解决电脑性能抖动带来的 TF 超时
    tf_buffer_duration: 30.
    
    # 提高对 X2 数据波动的容忍度
    use_scan_matching: true
    minimum_travel_distance: 0.1   # 降低门槛，针对你左右轮走不直的问题
    minimum_travel_heading: 0.1    
    scan_buffer_size: 25           # X2 数据不稳，多存几帧备用
    
    # 针对三角测距雷达的匹配优化
    # link_scan_maximum_distance 限制匹配距离，提高室内建图成功率
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.0
    do_loop_closing: true 

    # 空间搜索：X2 的噪声较大，稍微增加搜索维度
    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01