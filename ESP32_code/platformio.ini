; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[esp32_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_microros_transport = wifi
board_microros_distro = humble  ; 明确指定ROS 2版本


lib_deps = 
    https://github.com/micro-ROS/micro_ros_platformio.git
    https://github.com/madhephaestus/ESP32Encoder.git
    espressif/esp32-camera
    ESP32Servo

build_flags =
    -DBOARD_HAS_PSRAM=1
    -DCONFIG_SPIRAM_USE=1
    -DCONFIG_SPIRAM_TYPE_OCTAL=1  ; 强调八进制PSRAM类型
    -DCONFIG_SPIRAM_MODE_OCT=1
    -mfix-esp32-psram-cache-issue  ; 解决PSRAM缓存冲突问题

    -Llib/motion_status_msgs/lib
    -lmotion_status_msgs__rosidl_generator_c
    -lmotion_status_msgs__rosidl_typesupport_c
    -lmotion_status_msgs__rosidl_typesupport_introspection_c
    -lmotion_status_msgs__rosidl_typesupport_microxrcedds_c

    -Llib/motion_settings_service/lib
    -lmotion_settings_service__rosidl_generator_c
    -lmotion_settings_service__rosidl_typesupport_c
    -lmotion_settings_service__rosidl_typesupport_introspection_c
    -lmotion_settings_service__rosidl_typesupport_microxrcedds_c

    -Llib/camera_settings_service/lib
    -lcamera_settings_service__rosidl_generator_c
    -lcamera_settings_service__rosidl_typesupport_c
    -lcamera_settings_service__rosidl_typesupport_introspection_c
    -lcamera_settings_service__rosidl_typesupport_microxrcedds_c

; -------------esp32-wroom-32E----------------

[esp32_wroom_common]
extends = esp32_common
board = esp32dev

[env:esp32_wroom_motion]
extends = esp32_wroom_common
build_flags = ${esp32_wroom_common.build_flags} -D esp32_wroom_motion=\"esp32_wroom_motion\"

[env:esp32_wroom_camera]
extends = esp32_wroom_common
build_flags = ${esp32_wroom_common.build_flags} -D esp32_wroom_camera=\"esp32_wroom_camera\"

[env:esp32_wroom_ydlidarX2]
extends = esp32_wroom_common
build_flags = ${esp32_wroom_common.build_flags} -D esp32_wroom_ydlidarX2=\"esp32_wroom_ydlidarX2\"


; -------------esp32-s3----------------

[esp32_s3_common]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags = ${esp32_common.build_flags}
    -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1

board_build.psram_enable = true
board_build.psram_type = opi
board_build.psram_size = 8MB
board_build.arduino.memory_type = qio_opi  ; 明确指定Flash+PSRAM模式
board_build.flash_mode = qio
board_build.flash_freq = 80m

[env:esp32_s3_camera]
extends = esp32_s3_common
build_flags = ${esp32_s3_common.build_flags} -D esp32_s3_camera=\"esp32_s3_camera\"

; Flash 配置（8MB QIO模式，80MHz）
board_upload.flash_size = 8MB
board_upload.maximum_size = 16777216
board_build.flash_size = 8MB
board_build.arduino.partitions = default_8MB.csv  ; 8MB专用分区表

[env:esp32_s3_motion]
extends = esp32_s3_common
build_flags = ${esp32_s3_common.build_flags} -D esp32_s3_motion=\"esp32_s3_motion\"

; Flash 配置（16MB QIO模式，80MHz）
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.arduino.partitions = default_16MB.csv  ; 16MB专用分区表

